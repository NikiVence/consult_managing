name: consult-practicals
services:
  app:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run tools/prepare_web.py first}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      POSTGRES_DB: ${POSTGRES_DB:-consultations}
      POSTGRES_USER: ${POSTGRES_USER:-consultations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-}
      DB_HOST: db
      REDIS_URL: redis://cache:6379/0
    ports:
      - "127.0.0.1:8088:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, frontend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consultations}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run tools/prepare_web.py first}
      APP_DB_USER: ${POSTGRES_USER:-consultations}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/prepare_web.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-app.sh:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  cache:
    image: redis:7
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru, --save, ""]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  postgres-data:
networks:
  frontend:
    driver: bridge
  backend:
    internal: true
