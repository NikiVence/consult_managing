{% if form.non_field_errors %}<div role="alert" class="form-error">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="form-field">
{{ field.label_tag }}{{ field }}
{% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
{% if field.errors %}<div role="alert" class="form-error">{{ field.errors }}</div>{% endif %}
</div>{% endfor %}
